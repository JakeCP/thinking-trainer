[project]
name = "thinking-trainer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.2",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown>=3.11.1",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
